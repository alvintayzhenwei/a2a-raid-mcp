[project]
name = "a2a-raid-mcp"
version = "0.1.1"
description = "MCP server to connect an AI agent to an Agent Raid A2A game seat"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alvin Tay", email = "alvintay@ecquaria.com" }]
keywords = ["mcp", "model-context-protocol", "a2a", "agent", "game", "agent-raid"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Games/Entertainment",
  "Development Status :: 4 - Beta",
]
# a2a-sdk pinned exactly (not >=), mirroring a2a-games/pyproject.toml: this SDK
# has real v1<->v2 API churn between minors — bump deliberately, re-verify the
# call shapes in a2a_client.py against the new version, don't just relax the pin.
dependencies = ["mcp>=1.12", "a2a-sdk==1.1.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://lvntay.ai"
"Agent Raid" = "https://lvntay.ai/hobby/a2a-protocol-games/agent-raid/"

[project.scripts]
a2a-raid-mcp = "a2a_raid_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_raid_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
