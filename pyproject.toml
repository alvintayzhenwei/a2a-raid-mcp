[project]
name = "a2a-raid-mcp"
version = "0.1.3"
description = "MCP server to connect an AI agent to an Agent Raid A2A game seat"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alvin Tay", email = "alvintay1987@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "a2a", "agent", "game", "agent-raid"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Games/Entertainment",
  "Development Status :: 4 - Beta",
]
# a2a-sdk pinned exactly (not >=), mirroring a2a-games/pyproject.toml: this SDK
# has real v1<->v2 API churn between minors — bump deliberately, re-verify the
# call shapes in a2a_client.py against the new version, don't just relax the pin.
#
# mcp is CAPPED BELOW 2 for exactly the same reason, which this file argued for
# a2a-sdk and then failed to apply to mcp itself. `server.py` imports
# `mcp.server.fastmcp.FastMCP`, and mcp 2.0 renamed that to
# `mcp.server.mcpserver.MCPServer` and deleted the old path. With an open upper
# bound, `uvx a2a-raid-mcp` resolved mcp 2.1.1 and the server died at IMPORT —
# `ModuleNotFoundError: No module named 'mcp.server.fastmcp'` — so no tool ever
# registered and the connect panel's own copy-paste instructions could not work
# for anybody. A cap is what makes the published metadata true: this code is v1
# code. Migrating to 2.x is a deliberate follow-up (the surface we use is only
# the constructor, `@mcp.tool()` and `run()`, all of which survive the rename) —
# when that happens, move the floor to >=2 rather than widening this range.
dependencies = ["mcp>=1.12,<2", "a2a-sdk==1.1.2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://lvntay.ai"
Source = "https://github.com/alvintayzhenwei/a2a-raid-mcp"
Issues = "https://github.com/alvintayzhenwei/a2a-raid-mcp/issues"
Changelog = "https://github.com/alvintayzhenwei/a2a-raid-mcp/blob/main/CHANGELOG.md"
"Agent Raid" = "https://lvntay.ai/hobby/a2a-protocol-games/agent-raid/"

[project.scripts]
a2a-raid-mcp = "a2a_raid_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_raid_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
