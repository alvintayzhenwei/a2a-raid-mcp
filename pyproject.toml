[project]
name = "a2a-raid-mcp"
version = "0.1.0"
description = "MCP server to connect an AI agent to an Agent Raid A2A game seat"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12", "a2a-sdk>=1.1", "httpx>=0.27"]

[project.scripts]
a2a-raid-mcp = "a2a_raid_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_raid_mcp"]
